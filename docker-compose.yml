services:
  # -------------------------------------------------------------------------
  # Aplikasi web (Nginx + PHP-FPM, mendengarkan port 8080 DI DALAM container).
  # Port host diatur lewat APP_PORT agar tidak bentrok dengan aplikasi lain.
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
    image: keuangan-app:latest
    container_name: keuangan-app
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [keuangan]

  # -------------------------------------------------------------------------
  # Queue worker: mengirim notifikasi database + web push di background.
  # -------------------------------------------------------------------------
  queue:
    build:
      context: .
      target: runtime
    image: keuangan-app:latest
    container_name: keuangan-queue
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    command: php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks: [keuangan]

  # -------------------------------------------------------------------------
  # Task Scheduling: pengganti cron host, menjalankan bills:remind & budgets:check.
  # -------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      target: runtime
    image: keuangan-app:latest
    container_name: keuangan-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    command: php artisan schedule:work
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks: [keuangan]

  db:
    image: mysql:8.4
    container_name: keuangan-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-keuangan}
      MYSQL_USER: ${DB_USERNAME:-keuangan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    # Port database TIDAK dipublikasikan ke host secara default.
    # Buka baris di bawah hanya bila perlu akses dari luar VPS.
    # ports:
    #   - "${DB_PORT_HOST:-33061}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [keuangan]

  redis:
    image: redis:7-alpine
    container_name: keuangan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [keuangan]

volumes:
  db-data:
  redis-data:
  app-storage:

networks:
  keuangan:
    driver: bridge
